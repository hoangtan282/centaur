display_information:
  name: Centaur
  description: Centaur agent for Slack threads
  background_color: "#111827"
features:
  bot_user:
    display_name: Centaur
    always_online: true
  slash_commands:
    - command: /website-feedback
      url: https://YOUR_PUBLIC_SLACKBOT_HOST/api/slack/commands
      description: Create a Linear feedback issue
      usage_hint: bug or feedback summary
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - channels:history
      - chat:write
      - chat:write.public
      - commands
      - files:read
      - groups:history
      - im:history
      - mpim:history
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    request_url: https://YOUR_PUBLIC_SLACKBOT_HOST/api/webhooks/slack
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
    request_url: https://YOUR_PUBLIC_SLACKBOT_HOST/api/slack/actions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
